name: CI

# The UNTRUSTED workflow. It runs code from pull requests, including forks, and is built on the
# assumption that everything it checks out is hostile.
#
#   * `pull_request` (not `pull_request_target`) checks out the PR's own commit and gives a
#     read-only token with no access to repository secrets from a fork. `pull_request_target` would
#     run the fork's code with the base repository's permissions and secrets, which is the standard
#     way this goes wrong.
#   * No secret is referenced anywhere in this file. Every credential below belongs to a container
#     that lives for one job and is reachable only from it.
#   * Package lifecycle scripts are disabled during installs. A dependency's `postinstall` is
#     arbitrary code from a transitive package, executing before any check has run.
#   * Nothing here publishes, deploys, or writes to any account. Releasing is a separate,
#     trusted workflow: .github/workflows/release.yml
#
# Runs on pull-request candidates, on main, and on merge-queue integration candidates. A merge
# queue validates a commit that neither branch contains, so merge_group must be covered or the
# thing actually being merged is never tested.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Callable by the trusted release workflow, so a release re-runs this pipeline rather than a
  # copy of it. Two copies diverge, and the one that diverges is always the one nobody reads.
  workflow_call:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the versions module 01 actually verified. Widening this matrix requires evidence,
  # not optimism.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python — static, unit, integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: accessforge
          POSTGRES_PASSWORD: accessforge-ci
          POSTGRES_DB: accessforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accessforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ACCESSFORGE_SANDBOX_IMAGE: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      # Deliberately NOT the container's POSTGRES_USER. That role is a superuser, and superusers
      # bypass row-level security entirely — including FORCE — so the whole tenant-isolation suite
      # would run against no isolation at all. A dedicated NOSUPERUSER NOBYPASSRLS role is created
      # below, and `assert_row_level_security_enforced` fails the suite if this is ever pointed at a
      # bypassing role again.
      SUPERUSER_URL: postgresql://accessforge:accessforge-ci@localhost:5432/accessforge_test
      TEST_DATABASE_URL: postgresql://accessforge_app:accessforge-app-ci@localhost:5432/accessforge_test
      # CI-only credentials for a container that exists for the length of one job and is reachable
      # only from it. They are written here rather than in a secret because a secret implies these
      # protect something, and treating a throwaway container credential as sensitive makes the
      # genuinely sensitive ones harder to take seriously.
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: accessforge
      OBJECT_STORE_SECRET_KEY: accessforge-minio-ci
      OBJECT_STORE_BUCKET: accessforge-evidence
      # The application under test lives in its own database. See the step that creates it.
      REFAPP_DATABASE_URL: postgresql://accessforge_app:accessforge-app-ci@localhost:5432/accessforge_refapp

    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout action persists its token in .git/config by default, and later steps in
          # this workflow execute pull-request-controlled code -- a test, a build script, a
          # dependency's own code. Any of those can read the token out of the working tree. Nothing
          # here needs to push, so nothing here keeps a credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Start a real object store
        # A step rather than a `services:` entry, because the MinIO image needs the `server /data`
        # argument and a service container cannot be given a command.
        #
        # A real S3-compatible store, because the artifact suite has no filesystem fallback. A
        # stand-in would pass every assertion about size limits and content types while proving none
        # of what only a real store does -- most importantly that an object can be swapped underneath
        # a row that still records the old digest, which is the reason `promote` re-reads the bytes.
        run: |
          set -euo pipefail
          docker run -d --name accessforge-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_KEY" \
            quay.io/minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -sf "$OBJECT_STORE_ENDPOINT/minio/health/live" >/dev/null; then
              echo "object store live after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the object store never became live"
          docker logs accessforge-minio || true
          exit 1

      - name: Install pinned dependencies
        # --frozen fails if uv.lock does not match pyproject.toml, so a dependency change cannot
        # land without its lockfile.
        run: uv sync --frozen

      - name: Provision the pinned owned-build containment probe toolchain
        # No implicit pull at dispatch. The registry index supports Linux amd64 and arm64.
        run: >-
          docker pull
          node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32

      - name: Real owned-build containment probes
        run: uv run pytest -q tests/sandbox --tb=short

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Build the TypeScript contracts package
        # Required by the cross-language differential test below.
        #
        # --ignore-scripts: a dependency's install hooks are arbitrary code from a transitive
        # package, running before a single check has. Nothing in this workspace needs them, so
        # they are off; a dependency that stops working without them is a dependency to look at
        # rather than a flag to remove.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @accessforge/contracts build

      - name: Formatter check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: The published contract matches the live application
        # Generated from the same create_app a request goes through, then diffed against the
        # committed file. A hand-maintained OpenAPI document describes what someone believed the API
        # did; this one cannot drift without the diff showing it.
        run: uv run python scripts/generate_openapi.py --check

      - name: Type check (strict)
        # `scripts` is included: the operator scripts are the commands a runbook tells somebody to
        # run during an incident, which makes them the code least likely to be exercised before it
        # matters and the code where a TypeError is most expensive. Tests are included too:
        # the helpers used as proof must obey the same interfaces as production callers.
        run: >-
          uv run mypy apps/api/src fixtures/reference-app/src
          apps/orchestrator/src packages/agent-tools/navigation/src
          apps/build-worker/src
          packages/domain/src packages/contracts/python/src
          packages/persistence/src packages/evidence/src packages/clients/python/src scripts tests

      - name: Install a PostgreSQL 17 client
        # The runner image ships pg_dump 16, and the service container is PostgreSQL 17. An older
        # pg_dump refuses a newer server outright -- "aborting because of server version mismatch"
        # -- which is the good failure; the bad one would be a dump silently missing a newer
        # server's features. `infra/version-matrix.toml` already declared `pg_dump >= 17` for
        # exactly this reason, and this step is what makes CI meet its own declaration.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: The client matches the server it must dump
        # Asserted rather than assumed. A PATH that still resolved to the older client would make
        # every restore-drill test fail with a confusing error twenty minutes later.
        run: |
          set -euo pipefail
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE ' 1[7-9]\.' \
            || { echo "::error::pg_dump is older than the PostgreSQL 17 server"; exit 1; }

      - name: Create a non-superuser role for the tests
        # Row-level security is the isolation mechanism, so the tests must not run as a role that
        # ignores it. This role owns nothing yet; the migrations it runs will make it the table
        # owner, and FORCE ROW LEVEL SECURITY applies to owners too.
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'accessforge_app') THEN
              CREATE ROLE accessforge_app LOGIN PASSWORD 'accessforge-app-ci'
                NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            END IF;
          END
          $$;
          GRANT ALL ON SCHEMA public TO accessforge_app;
          SQL

      - name: Give the application under test its own database
        # Separate from the product's, and the separation is load-bearing rather than tidy. The
        # completion observer's whole value is that it reads the *application's* durable state rather
        # than what the product recorded about it, and those are only different sources if they are
        # different databases. Sharing one would make the independence assertion in
        # tests/integration/test_completion_observer.py vacuous -- it would be comparing a URL to
        # itself -- and it is also the arrangement that produced module 06's silent table collision,
        # where the product's `fixture_instance` was the name the application already used.
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE accessforge_refapp OWNER accessforge_app"
          psql "postgresql://accessforge:accessforge-ci@localhost:5432/accessforge_refapp" \
            -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO accessforge_app"

      - name: Confirm the test role cannot bypass row-level security
        # One clear sentence instead of sixteen assertion failures if this regresses.
        run: |
          uv run python -c "
          import os
          from accessforge_persistence import assert_row_level_security_enforced
          assert_row_level_security_enforced(os.environ['TEST_DATABASE_URL'])
          print('test role enforces row-level security')
          "

      - name: Confirm PostgreSQL is genuinely reachable
        # Without this, a broken service container would turn every integration test into a skip
        # and the job would still be green.
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TEST_DATABASE_URL"]) as c:
              row = c.execute("SELECT version()").fetchone()
          assert row and "PostgreSQL" in row[0], row
          print("connected:", row[0].split(",")[0])
          PY

      - name: Generated bindings match the schemas
        # The schemas are authoritative and the bindings are derived. A schema edited without
        # regenerating them would otherwise ship two disagreeing definitions of the vocabulary.
        run: uv run python scripts/generate_contract_bindings.py --check

      - name: The generated clients match the contract
        # Third link in the same chain: the app generates the contract, the contract generates the
        # client. A route that changed shape without its client changing with it is a diff here,
        # not a 404 somebody hits in production six weeks later.
        run: uv run python scripts/generate_clients.py --check

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Contract tests (schemas, canonicalization, cross-language digests)
        # Needs the TypeScript build: the differential test executes both implementations and
        # fails rather than skips if the build output is missing.
        run: uv run pytest tests/contract -q

      - name: Integration tests (real PostgreSQL)
        # Fails, rather than skips, if TEST_DATABASE_URL is absent — see
        # tests/integration/test_reference_app_journey.py::test_integration_suite_is_actually_configured
        run: uv run pytest tests/integration -q

      - name: Evidence verifier — a bundle is checkable by someone with nothing else
        # The verifier is the product's load-bearing claim: a reader with the bundle and a key
        # obtained out of band can check it without access to this system. So it is exercised as a
        # standalone command against files, not as a library call inside a test that already holds
        # a database connection.
        #
        # `--check-tamper` is the half that matters. A verifier that only ever sees intact bundles
        # is a verifier nobody has watched refuse anything.
        run: uv run pytest tests/integration/test_evidence_export.py tests/contract -q

      - name: Backup and restore drill — real pg_dump, real restore, real reconciliation
        # Not a mocked filesystem. A backup that has never been restored is a hypothesis.
        env:
          # FORCE ROW LEVEL SECURITY applies to the table owner, so the application role cannot
          # pg_dump its own rows. A backup needs the bypassing role, and the drill asserts that
          # the application role's attempt fails rather than quietly producing an empty dump.
          BACKUP_DATABASE_URL: postgresql://accessforge:accessforge-ci@localhost:5432/accessforge_test
        run: |
          uv run pytest tests/integration/test_restore_drill.py \
                        tests/integration/test_backup_archive_drill.py \
                        tests/integration/test_forward_migration_and_interruption.py \
                        tests/integration/test_readiness_and_shutdown.py -q

      - name: Assert the integration suite actually executed
        # A suite that collected nothing must not be reported as a passing boundary.
        run: |
          count=$(uv run pytest tests/integration --collect-only -q 2>/dev/null | tail -1)
          echo "collected: $count"
          uv run pytest tests/integration --collect-only -q 2>/dev/null \
            | grep -qE "^[1-9][0-9]* tests? collected" \
            || { echo "::error::integration suite collected no tests"; exit 1; }

  node:
    name: Node — build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm -r --if-present typecheck

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm -r --if-present test

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the specification-pack guard compares against the merge base with main.
          # With the default shallow fetch there is no origin/main ref at all, and the comparison
          # silently degrades to "nothing changed".
          fetch-depth: 0

      - name: Internal links resolve
        run: |
          fail=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            while read -r link; do
              case "$link" in http*|mailto:*|"") continue;; esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$d/$target" ]; then
                echo "::error file=$f::broken internal link: $link"; fail=1
              fi
            done < <(grep -oE '\]\([^)#][^)]*\)' "$f" | sed -E 's/^\]\(//; s/\)$//')
          done < <(find README.md docs -name '*.md')
          exit $fail

      - name: Specification pack is unmodified
        # specs/accessforge/ is supplied input. A change there is a contract change and must be
        # deliberate, not a drive-by edit inside an implementation PR.
        #
        # No error is suppressed here. The previous version piped git's stderr to /dev/null and
        # appended `|| true`, so when origin/main could not be resolved the guard reported
        # success unconditionally — a check that proved nothing while showing green.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base refs/remotes/origin/main HEAD)"
          echo "comparing against merge-base $base"

          # Self-test: if the comparison machinery is broken, it returns empty for everything and
          # the guard below is vacuous. On a pull request this branch must differ from the merge
          # base somewhere, so an empty overall diff means the mechanism itself has failed.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            all_changed="$(git diff --name-only "$base" HEAD)"
            if [ -z "$all_changed" ]; then
              echo "::error::diff against the merge base returned nothing; this guard is not working"
              exit 1
            fi
            echo "mechanism verified: $(echo "$all_changed" | wc -l | tr -d ' ') file(s) differ from base"
          fi

          changed="$(git diff --name-only "$base" HEAD -- specs/)"
          if [ -n "$changed" ]; then
            echo "::error::specification pack modified: $changed"
            echo "Contract changes require reconciling PRD/CONTRACTS/TDD/TEST-PLAN together."
            exit 1
          fi
          echo "specification pack unmodified"

      - name: The proposed IAM policies render to valid documents
        # The files in infra/aws/iam/ carry `"//"` annotations, which JSON treats as data and IAM
        # rejects. This checks that stripping them leaves a structurally valid policy, so the
        # explanations cannot quietly turn the proposal into something that cannot be attached.
        #
        # Structure only. Nothing here is validated against AWS: there are no credentials, and a
        # check that implied otherwise would be the unearned claim this product exists to refuse.
        run: |
          python3 scripts/render_iam_policy.py --check infra/aws/iam/*.json

      - name: No secrets or local paths committed
        run: |
          if grep -rEn 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
               --include='*.md' --include='*.py' --include='*.ts' --include='*.yml' . ; then
            echo "::error::possible secret committed"; exit 1
          fi
          if grep -rEn '/Users/[a-z]+/' --include='*.md' docs/ ; then
            echo "::error::local filesystem path committed to documentation"; exit 1
          fi

  security:
    name: Security — dependency review, adversarial suites, secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout action persists its token in .git/config by default, and later steps in
          # this workflow execute pull-request-controlled code -- a test, a build script, a
          # dependency's own code. Any of those can read the token out of the working tree. Nothing
          # here needs to push, so nothing here keeps a credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pinned dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Known vulnerabilities in the locked Python dependency set
        # Audits `uv.lock` rendered with `--frozen`, not the installed environment: a lock pinning a
        # vulnerable version would otherwise pass on a runner that happened to resolve something
        # else, and the gate would be green about the wrong artifact.
        #
        # Nothing is installed and no package code runs -- `--no-deps` and `--disable-pip` inside the
        # script -- which is the Python equivalent of `--ignore-scripts` below. Resolving a
        # dependency can mean executing a third party's `setup.py` inside this job.
        #
        # No `continue-on-error` and no `|| true`. Every advisory at every severity fails this step,
        # and there is no ignore list to add one to; a guard below asserts all of that against this
        # file so the gate cannot be softened without the assertion failing.
        run: uv run python scripts/audit_python_dependencies.py

      - name: Known vulnerabilities in the JavaScript dependency tree
        # Reported at high and above and allowed to fail the job. An advisory that is genuinely not
        # applicable is dismissed with a recorded reason in pnpm's own overrides, not by lowering
        # this threshold: a threshold lowered once stays lowered.
        run: pnpm audit --audit-level=high

      - name: The authorization matrix and the boundary probes
        # These are unit-level and need no database. They are the tests that fail when a permission
        # check is removed, so they run in their own stage where a failure is unambiguous rather
        # than one line in a suite of fourteen hundred.
        run: uv run pytest tests/unit/test_authorization_matrix.py tests/unit/test_authority.py -q

      - name: No path to an unearned PASS
        # The single assertion the whole product rests on. Given its own stage for the same reason
        # a smoke alarm is not wired through the doorbell.
        run: uv run pytest tests/unit/test_no_path_to_unearned_pass.py -q

      - name: Configuration fails closed
        run: uv run pytest tests/unit/test_config_fails_closed.py -q

      - name: The backup envelope refuses truncation, reordering and splicing
        run: uv run pytest tests/unit/test_backup_envelope.py -q

      - name: The untrusted workflow is structurally untrusted
        # Two structural checks on the workflows themselves, and both look at what the file *does*
        # rather than at its text.
        #
        # The distinction is not pedantry. The first version of these steps grepped the raw file
        # and failed against its own explanatory comments -- a check that matched the prose warning
        # about the thing it was checking for. A text search over a file that discusses its own
        # threat model finds the discussion.
        #
        #   1. No `secrets.` expression outside a comment. The protection here is that a fork's code
        #      never sees a credential; the way that protection is lost is one line added to make a
        #      flaky step work.
        #   2. No workflow triggers on `pull_request_target`, checked by parsing the trigger keys.
        #      That trigger runs a fork's code with the base repository's permissions and secrets.
        run: |
          uv run python - <<'PY'
          import re, sys, pathlib
          import yaml

          failures = []

          ci = pathlib.Path(".github/workflows/ci.yml")
          for number, line in enumerate(ci.read_text().splitlines(), start=1):
              code = line.split("#", 1)[0]
              for match in re.finditer(r"secrets\.([A-Za-z_][A-Za-z0-9_]*)", code):
                  if match.group(1) != "GITHUB_TOKEN":
                      failures.append(f"{ci}:{number}: references secrets.{match.group(1)}")

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              document = yaml.safe_load(path.read_text())
              # PyYAML resolves the bare key `on` to the boolean True.
              triggers = document.get("on", document.get(True)) or {}
              if isinstance(triggers, str):
                  triggers = {triggers: None}
              if isinstance(triggers, list):
                  triggers = dict.fromkeys(triggers)
              if "pull_request_target" in triggers:
                  failures.append(f"{path}: triggers on pull_request_target")

          # 3. The Python dependency audit is present, fail-closed, and reads the lock. Each of
          #    these is a way the gate could go green while auditing nothing: the step deleted, its
          #    failure swallowed, the scanner unpinned, or the input switched from the lock to
          #    whatever is installed.
          document = yaml.safe_load(ci.read_text())
          steps = document["jobs"]["security"]["steps"]
          # This step is itself a step in this job, and its own source mentions the script and every
          # pattern it looks for -- so a naive scan matches the guard and fails on itself. That is
          # not hypothetical: it happened on the first run of this check. Candidates exclude any
          # step that parses YAML, which is this one and only this one.
          audit = [
              step
              for step in steps
              if "audit_python_dependencies.py" in str(step.get("run", ""))
              and "safe_load" not in str(step.get("run", ""))
          ]
          if len(audit) != 1:
              failures.append(
                  f"expected exactly one Python dependency audit step, found {len(audit)}"
              )
          for step in audit:
              if step.get("continue-on-error"):
                  failures.append("the Python dependency audit is continue-on-error, so it cannot fail the build")
              run = str(step.get("run", ""))
              for swallow in ("|| true", "|| :", "; true", "set +e"):
                  if swallow in run:
                      failures.append(f"the Python dependency audit swallows its exit status with `{swallow}`")

          script = pathlib.Path("scripts/audit_python_dependencies.py").read_text()
          for required, why in (
              ('"--frozen"', "the export could re-resolve, so the audited set would not be the locked set"),
              ('"--no-deps"', "pip-audit could resolve dependencies, which executes third-party setup code"),
              ('"--disable-pip"', "pip could be invoked, which executes third-party setup code"),
              ('"--strict"', "pip-audit could skip a package it failed to read and still exit zero"),
          ):
              if required not in script:
                  failures.append(f"the audit script no longer passes {required}: {why}")
          # Executable code only, via the script's own detector. A substring search over the file
          # matched the prose that names these flags in order to forbid them -- so documenting the
          # guarantee would have turned the security job red, and the obvious fix would have looked
          # like deleting the check. Docstrings are stripped and comments never survive `ast.unparse`.
          sys.path.insert(0, "scripts")
          from audit_python_dependencies import suppression_in_code

          for forbidden in suppression_in_code(script):
              failures.append(f"the audit script suppresses findings with {forbidden}")

          lock = pathlib.Path("uv.lock").read_text()
          if 'name = "pip-audit"' not in lock:
              failures.append("pip-audit is not in uv.lock, so the scanner itself is unpinned")

          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          print(
              "no repository secret is referenced; no workflow uses pull_request_target; "
              "the Python dependency audit is present, pinned, fail-closed and reads the lock"
          )
          PY

  platform-only:
    name: Platform-only tests — reported, never marked passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: State what this pipeline cannot exercise
        # A job that says so out loud, because the alternative is a green pipeline that a reader
        # takes as evidence about a real screen reader.
        #
        # It exits 0 deliberately: these are not failures, they are absences, and a red X here would
        # train everyone to ignore a red X. What it must never do is let anything downstream treat
        # "CI passed" as covering them. That is why the text is here, in the run log, rather than in
        # a document somebody would have to go and find.
        run: |
          cat <<'NOTE'
          ============================================================================
          NOT RUN in this pipeline. No result below is evidence of anything.
          ============================================================================

          macOS VoiceOver actual-AT control
              Needs a macOS host with VoiceOver enabled and Accessibility + Automation
              permission granted to the runner process. A Linux container cannot provide
              it and no emulation of it produces evidence about a real screen reader.
              Status: BLOCKED. See infra/version-matrix.toml [capability.voiceover].

          Windows NVDA actual-AT control
              Needs a Windows host with NVDA and its controller client. Not obtainable
              from Linux, including under virtualization that does not present a real
              interactive desktop session.
              Status: BLOCKED. See infra/version-matrix.toml [capability.nvda].

          Bedrock model invocation
              Needs AWS credentials with model access, and separately, approval to incur
              charges. Credentials alone are not approval.
              Status: BLOCKED. See infra/version-matrix.toml [capability.bedrock].

          Hosted deployment
              No cloud resource is created by any workflow in this repository. The AWS
              configuration under infra/aws/ is PREPARED and unapplied.
              See docs/operations/DEPLOYMENT.md.

          ============================================================================
          Any claim that this release has been verified against a real screen reader,
          a real model, or a hosted deployment is false unless it cites evidence from
          somewhere other than this pipeline.
          ============================================================================
          NOTE

      - name: The capability matrix still declares these as blocked
        # If somebody flips one of these to OK in the matrix, this job's text becomes a lie. The
        # assertion lives in the test suite; this is the line that makes the job notice.
        run: |
          set -euo pipefail
          for capability in voiceover nvda bedrock; do
            if ! grep -A3 "\[capability.$capability\]" infra/version-matrix.toml \
                 | grep -q 'status = "BLOCKED"'; then
              echo "::error::[capability.$capability] is no longer BLOCKED but this job still says it is"
              exit 1
            fi
          done
          echo "the matrix and this job agree: three capabilities remain blocked"

[project]
name = "accessforge-navigation-tools"
version = "0.0.0"
description = "Sealed navigator projection, action schema and supervisor dispatch boundary."
requires-python = ">=3.13,<3.14"
dependencies = [
  "accessforge-domain",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_navigation_tools"]

[tool.uv.sources]
accessforge-domain = { workspace = true }

[project]
name = "accessforge-evidence"
version = "0.0.0"
description = "Versioned evidence bundles and the offline verifier. No network, no account."
requires-python = ">=3.13,<3.14"
dependencies = ["accessforge-domain", "cryptography>=44"]

[tool.uv.sources]
accessforge-domain = { workspace = true }

[project.scripts]
accessforge-verify = "accessforge_evidence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_evidence"]

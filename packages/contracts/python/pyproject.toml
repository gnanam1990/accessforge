[project]
name = "accessforge-contracts"
version = "0.0.0"
description = "Schema loading and trust-boundary validation. JSON Schema is authoritative; this package never redefines it."
requires-python = ">=3.13,<3.14"
# accessforge-domain is a real runtime dependency: schema_digest() canonicalizes through it.
dependencies = ["jsonschema>=4.23", "accessforge-domain"]

[tool.uv.sources]
accessforge-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_contracts"]

# The hook includes shared schemas once in direct wheels and inside source distributions.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

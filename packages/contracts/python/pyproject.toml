[project]
name = "accessforge-contracts"
version = "0.0.0"
description = "Schema loading and trust-boundary validation. JSON Schema is authoritative; this package never redefines it."
requires-python = ">=3.13,<3.14"
# accessforge-domain is a real runtime dependency: schema_digest() canonicalizes through it.
dependencies = ["jsonschema>=4.23", "accessforge-domain"]

[tool.uv.sources]
accessforge-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_contracts"]

# The schemas live outside the package directory because they are the shared, authoritative
# source for both languages. Without this the wheel would ship code that cannot find them.
[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "accessforge_contracts/schemas"

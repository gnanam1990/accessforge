[project]
name = "accessforge-domain"
version = "0.0.0"
description = "Pure deterministic domain logic: canonicalization, state reducers and outcome rules. No I/O."
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_domain"]

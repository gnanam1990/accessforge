[project]
name = "accessforge-orchestrator"
version = "0.0.0"
description = "Bounded Strands navigator and evidence diagnosis workers."
requires-python = ">=3.13,<3.14"
dependencies = [
  "accessforge-build-worker",
  "accessforge-navigation-tools",
  "accessforge-persistence",
  "botocore==1.43.91",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10",
  "strands-agents==1.55.1",
]

[project.scripts]
accessforge-purge-worker = "accessforge_orchestrator.maintenance.purge_worker:main"
accessforge-effect-recovery = "accessforge_orchestrator.effect_recovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_orchestrator"]

[tool.uv.sources]
accessforge-build-worker = { workspace = true }
accessforge-navigation-tools = { workspace = true }
accessforge-persistence = { workspace = true }

[project]
name = "accessforge-orchestrator"
version = "0.0.0"
description = "Bounded Strands navigator and evidence diagnosis workers."
requires-python = ">=3.13,<3.14"
dependencies = [
  "accessforge-navigation-tools",
  "accessforge-persistence",
  "pydantic>=2.10",
  "strands-agents==1.55.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessforge_orchestrator"]

[tool.uv.sources]
accessforge-navigation-tools = { workspace = true }
accessforge-persistence = { workspace = true }

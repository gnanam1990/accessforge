[project]
name = "accessforge-workspace"
version = "0.0.0"
description = "AccessForge workspace root (not a distributable package)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "accessforge-api",
  "accessforge-reference-app",
  "accessforge-domain",
  "accessforge-contracts",
  "accessforge-persistence",
  "accessforge-evidence",
  "accessforge-client",
  "accessforge-navigation-tools",
  "accessforge-orchestrator",
]

[tool.uv.sources]
accessforge-api = { workspace = true }
accessforge-reference-app = { workspace = true }
accessforge-domain = { workspace = true }
accessforge-contracts = { workspace = true }
accessforge-persistence = { workspace = true }
accessforge-evidence = { workspace = true }
accessforge-client = { workspace = true }
accessforge-navigation-tools = { workspace = true }
accessforge-orchestrator = { workspace = true }

[tool.uv.workspace]
members = [
  "apps/api",
  "fixtures/reference-app",
  "packages/domain",
  "packages/contracts/python",
  "packages/persistence",
  "packages/evidence",
  "packages/clients/python",
  "packages/agent-tools/navigation",
  "apps/orchestrator",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.122",
  "pytest-timeout>=2.3",
  "types-jsonschema>=4.23",
  # The dependency auditor. A locked dev dependency rather than a floating `uvx` invocation so the
  # scanner itself is pinned and hash-verified by uv.lock, like everything else it audits: a scanner
  # resolved fresh on every run is one whose behaviour can change without a commit.
  "pip-audit>=2.9",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
  "apps/api/src",
  "fixtures/reference-app/src",
  "packages/domain/src",
  "packages/clients/python/src",
  "packages/contracts/python/src",
  "packages/evidence/src",
  "packages/persistence/src",
  "packages/agent-tools/navigation/src",
  "apps/orchestrator/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID"]
ignore = ["S101"]  # assert is how pytest expresses expectations

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test tokens are fixtures, not secrets
# Generated from the schemas by scripts/generate_contract_bindings.py; formatting is the
# generator's concern, and hand-editing it would be overwritten by the next run anyway.
"**/_generated.py" = ["E501"]
# Same reason: generated by scripts/generate_clients.py from the published contract.
"**/_operations.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"accessforge_api.internal".msg = "apps must not import another app's private implementation"
"reference_app.internal".msg = "apps must not import another app's private implementation"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "apps/api/src:apps/orchestrator/src:fixtures/reference-app/src:packages/agent-tools/navigation/src:packages/domain/src:packages/contracts/python/src:packages/persistence/src:packages/evidence/src:packages/clients/python/src:scripts"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
# boto3 ships no type information. boto3-stubs is a very large dependency for the four S3 methods
# this project calls, and those calls are already wrapped in typed functions of our own, so the
# untyped surface is four method names rather than an API.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL server",
  "fake: uses a labelled in-process fake, never actual-AT or real-service evidence",
]
# A global timeout so a database deadlock fails loudly instead of hanging CI until the job limit.
# A fixture that nested a scoped connection inside a TRUNCATE transaction did exactly that.
timeout = 60
addopts = "-ra --strict-markers"
